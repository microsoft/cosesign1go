name: Build & Release
on:
  push:
    tags:
      - "v*"

env:
  GO_VERSION: "1.27.x"


jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - run: go build ./cmd/sign1util
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: amd64
      - run: go build ./cmd/sign1util
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: 0
      - run: go build -o sign1util-darwin-amd64 ./cmd/sign1util
        env:
          GOOS: darwin
          GOARCH: amd64
          CGO_ENABLED: 0
      - run: go build -o sign1util-darwin-arm64 ./cmd/sign1util
        env:
          GOOS: darwin
          GOARCH: arm64
          CGO_ENABLED: 0

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binaries
          path: |
            sign1util.exe
            sign1util
            sign1util-darwin-amd64
            sign1util-darwin-arm64

  draft_release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binaries

      - name: Publish draft release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          # This is to make sure that the release is not created if a non-rc tag is pushed
          draft: true
          generate_release_notes: true
          files: |
            sign1util.exe
            sign1util
            sign1util-darwin-amd64
            sign1util-darwin-arm64
